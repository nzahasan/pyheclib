[build-system]
requires = ["setuptools>=61", "wheel", "cython>=3", "numpy"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = ["ignore::DeprecationWarning:matplotlib.*", "ignore::DeprecationWarning:pyparsing.*"]

[tool.cibuildwheel]
build = "cp39-* cp310-* cp311-* cp312-* cp313-*"
skip = "*-musllinux_* *-win32 *-manylinux_i686"
test-command = "python -c \"import pyheclib, pyheclib._core\""

[tool.cibuildwheel.linux]
archs = ["x86_64"]
manylinux-x86_64-image = "manylinux_2_28"

[tool.cibuildwheel.macos]
archs = ["arm64"]
# the bundled libhecdss.dylib requires macOS 14
environment = { MACOSX_DEPLOYMENT_TARGET = "14.0" }
# skip delocate: libhecdss.dylib is already bundled (rpath @loader_path) and its
# @rpath/libz.1.dylib is the system zlib, which delocate can't find on disk
repair-wheel-command = ""

[tool.cibuildwheel.windows]
archs = ["AMD64"]

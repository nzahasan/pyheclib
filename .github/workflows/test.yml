name: test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:

    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        # python 3.8 & 3.9 are not available on the newest runner images
        # (ubuntu 26.04, apple silicon macos), test them where they still exist
        include:
          - { os: ubuntu-24.04, python-version: "3.8" }
          - { os: ubuntu-24.04, python-version: "3.9" }
          - { os: windows-latest, python-version: "3.8" }
          - { os: windows-latest, python-version: "3.9" }

    steps:
    - uses: actions/checkout@v7
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip setuptools
        pip install -r requirements.txt
    - name: Build Cython Extension
      run: |
        python setup.py build_ext --inplace
    - name: Test with pytest
      run: |
        python -m pytest -q tests
